name: ScoutSVM CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Static regression QA
        run: npm run qa:static

      - name: Scout Year date regression tests
        run: npm run test:scout-year

      - name: Budget / secretary / best chefs / reservations regressions
        run: |
          npm run test:budget-year
          npm run test:secretary-forms
          npm run test:best-chefs-year
          npm run test:reservations

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
